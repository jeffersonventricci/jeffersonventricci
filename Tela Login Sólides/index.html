<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">

    <title>Login Solides</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">

</head>
<body>
    <div class="logo">
        <img src="./img/solides.png">
    </div>

    <div class="container">
        <h1>Entre com sua conta</h1>

        
            <label id="login">Login social:</label>
        
        
            <div class="login-social">
                <img src="./img/google.png">
                <button>Entrar com Google</button>
            </div>

            <div class="login-social">
                <img src="./img/linkdin.png" id="img-linkedin">
                <button id="linkedin">Entrar com Linkdin</button>
            </div>
       

        <label id="cadastro">Ou entre com os dados cadastrados:</label>

        <label id="email" for="nome">E-mail</label>
        <div class="login">
            <div class="input-box">                
                <input type="text" id="nome" placeholder="nome@email.com">
            </div>

        <label id="senha" for="senha">Senha</label>
            <div class="input-box">                
                <input id="input-baixo" type="password" id="senha">
                <i class="fa-solid fa-eye"></i>
                <i id="close" class="fa-solid fa-eye-slash"></i>
            </div>
        </div>
        
            <a href="#" id="esqueci-senha">Esqueci minha senha</a>

            <div class="button-entrar">
                <button>Entrar</button>
            </div>

            <div class="rodape">   
                <label>Não tem conta?</label><a href="#">Cadastrar</a>
             </div>

        <div class="img-fixed">
            <img src="./img/support.jpg">
        </div>
             
    </div>                
</body>
</html>
