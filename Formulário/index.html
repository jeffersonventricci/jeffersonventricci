<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="author" content="Jefferson">
    <meta name="description" content="form, formulario, cadastro, cadastro cliente">

    <link rel="stylesheet" href="styles.css">


    <title>Formulário de Clientes</title>
</head>
<body>
    <div class="container">
        <div class="form-img">
            <img src="img/backimage.svg">
        </div> <!-- form-img -->

        <div class="form">
          <form action="#">

            <div class="form-header"> <!--div que separa o cabeçalho -->
                <div class="title">
                    <h1>Cadastra-se</h1>
                </div> <!--title-->
                <div class="login-button">
                    <button><a href="#">Entrar</a> </button>
                </div> <!--login-button-->
            </div> <!-- form-header -->

             <div class="input-group"> <!-- div que separa os campos de preenchimento -->
                 <div class="input-box">
                    <label for="firstname">Primeiro Nome</label>
                    <input type="text" id="firstname" name="firstname" placeholder="Digite seu primeiro nome" required>
                 </div> <!--input-box-->

                  <div class="input-box">
                    <label for="lastname">Sobrenome</label>
                    <input type="text" id="lastname" name="lastname" placeholder="Digite seu sobrenome" required>
                 </div> <!--input-box-->

                  <div class="input-box">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                 </div> <!--input-box-->

                  <div class="input-box">
                    <label for="number">Digite seu Telefone</label>
                    <input type="tel" id="number" name="number" placeholder="(xx-) xxxx-xxxx" required>
                 </div> <!--input-box-->

                  <div class="input-box">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" placeholder="Digite sua senha" required>
                 </div> <!--input-box-->

                  <div class="input-box">
                    <label for="confpassword">Confirme sua senha</label>
                    <input type="confpassword" id="confpassword" name="confpassword" placeholder="Digite sua senha novamente" required>
                 </div> <!--input-box-->
             </div><!--input group-->

             <div class="gender-inputs"> <!-- div para colocar os radios button -->
                <div class="gender-title"> <!--div para a palavra título-->
                    <h6>Gênero</h6>
                </div> <!-- gender-title-->

                <div class="gender-group"> <!--div para os conjuntos de inputs de radio-->
                    <div class="gender-input">
                        <input type="radio" id="female" name="gender">
                        <label for="female">Feminino</label>
                    </div>

                    <div class="gender-input">
                        <input type="radio" id="male" name="gender">
                        <label for="male">Masculino</label>
                    </div>

                    <div class="gender-input">
                        <input type="radio" id="other" name="gender">
                        <label for="other">Outros</label>
                    </div>

                    <div class="gender-input">
                        <input type="radio" id="none" name="gender">
                        <label for="none">Prefiro não dizer</label>
                    </div>
                </div> <!--gender-group-->
             </div> <!--gender-inputs-->

              <div class="continue-button">
                <button><a href="#">Continuar</a> </button>
              </div> <!--continue-button-->

          </form>
        </div> <!-- form -->
    </div> <!-- container -->
</body>
</html>
